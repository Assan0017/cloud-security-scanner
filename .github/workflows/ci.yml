name: Cloud Security Scanner CI & Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-scan:
    name: Run Tests and Security Scan
    runs-on: ubuntu-latest

    env:
      # Mock AWS credentials for moto and boto3 in CI
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SECURITY_TOKEN: testing
      AWS_SESSION_TOKEN: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Run Demo Cloud Security Scan
        run: |
          python demo_scan.py

      - name: Upload Security Scan HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: cloud-security-report
          path: reports/demo_report.html
          if-no-files-found: warn
